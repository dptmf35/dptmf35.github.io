<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a9199"/>
    </marker>
  </defs>

  <!-- left: centralized KF -->
  <rect x="20" y="20" width="400" height="30" rx="15" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="220" y="40" font-size="14" fill="#2c5aa0" text-anchor="middle" font-weight="bold">Kalman filter: 순차 update</text>
  <rect x="20" y="62" width="400" height="250" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <rect x="40" y="90" width="90" height="34" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="85" y="112" font-size="12" fill="#333" text-anchor="middle">예측 (x̄, P̄)</text>
  <rect x="160" y="90" width="90" height="34" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="205" y="112" font-size="12" fill="#333" text-anchor="middle">센서 1 update</text>
  <rect x="280" y="90" width="90" height="34" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="325" y="112" font-size="12" fill="#333" text-anchor="middle">센서 2 update</text>
  <line x1="132" y1="107" x2="156" y2="107" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrt)"/>
  <line x1="252" y1="107" x2="276" y2="107" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrt)"/>
  <text x="40" y="160" font-size="12" fill="#6b7178">· 센서마다 gain K를 계산해 차례로 보정</text>
  <text x="40" y="182" font-size="12" fill="#6b7178">· 매 update마다 (H P̄ Hᵀ + R)⁻¹ : 측정 차원 크기의 역행렬</text>
  <text x="40" y="204" font-size="12" fill="#6b7178">· 측정이 독립이면 순서가 결과에 영향 없음 (수학적으로 동치)</text>
  <text x="40" y="226" font-size="12" fill="#6b7178">· 늦게 도착한 측정을 끼워 넣기 어려움</text>
  <text x="40" y="248" font-size="12" fill="#6b7178">· prediction이 싸다: P̄ = F P Fᵀ + Q</text>
  <text x="40" y="284" font-size="12" fill="#2c5aa0">상태 차원 작고 센서 적을 때 유리</text>

  <!-- right: information filter -->
  <rect x="440" y="20" width="400" height="30" rx="15" fill="#fbeed6" stroke="#e6cfa0"/>
  <text x="640" y="40" font-size="14" fill="#b5761a" text-anchor="middle" font-weight="bold">Information filter: 정보 합산</text>
  <rect x="440" y="62" width="400" height="250" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <rect x="460" y="76" width="96" height="30" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="508" y="96" font-size="12" fill="#333" text-anchor="middle">센서 1 (i₁, I₁)</text>
  <rect x="460" y="114" width="96" height="30" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="508" y="134" font-size="12" fill="#333" text-anchor="middle">센서 2 (i₂, I₂)</text>
  <rect x="460" y="152" width="96" height="30" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="508" y="172" font-size="12" fill="#333" text-anchor="middle">센서 3 (i₃, I₃)</text>
  <rect x="640" y="108" width="110" height="46" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="695" y="127" font-size="12" fill="#333" text-anchor="middle">Λ = Λ̄ + Σ Iₖ</text>
  <text x="695" y="145" font-size="12" fill="#333" text-anchor="middle">η = η̄ + Σ iₖ</text>
  <line x1="558" y1="91" x2="636" y2="122" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrt)"/>
  <line x1="558" y1="129" x2="636" y2="131" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrt)"/>
  <line x1="558" y1="167" x2="636" y2="140" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrt)"/>
  <text x="460" y="204" font-size="12" fill="#6b7178">· 센서 k의 기여: iₖ = Hₖᵀ Rₖ⁻¹ zₖ,  Iₖ = Hₖᵀ Rₖ⁻¹ Hₖ</text>
  <text x="460" y="226" font-size="12" fill="#6b7178">· update는 덧셈이라 순서·지연·개수에 무관, 분산 처리 쉬움</text>
  <text x="460" y="248" font-size="12" fill="#6b7178">· 대신 prediction에 상태 차원 역행렬 필요</text>
  <text x="460" y="270" font-size="12" fill="#6b7178">· 평균을 읽으려면 Λ⁻¹η 를 풀어야 함</text>
  <text x="460" y="294" font-size="12" fill="#b5761a">센서 많고 분산·비동기 fusion일 때 유리</text>
</svg>
