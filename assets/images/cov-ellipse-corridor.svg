<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a9199"/>
    </marker>
  </defs>

  <!-- left: LiDAR in corridor -->
  <rect x="20" y="20" width="400" height="30" rx="15" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="220" y="40" font-size="14" fill="#2c5aa0" text-anchor="middle" font-weight="bold">LiDAR odometry (긴 복도)</text>
  <rect x="20" y="62" width="400" height="250" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <!-- corridor walls -->
  <line x1="50" y1="120" x2="390" y2="120" stroke="#333" stroke-width="3"/>
  <line x1="50" y1="220" x2="390" y2="220" stroke="#333" stroke-width="3"/>
  <!-- ellipse: long along corridor -->
  <ellipse cx="220" cy="170" rx="120" ry="18" fill="#e9f1fb" stroke="#2c5aa0" stroke-width="2" opacity="0.9"/>
  <circle cx="220" cy="170" r="4" fill="#2c5aa0"/>
  <!-- axis annotations -->
  <line x1="220" y1="170" x2="335" y2="170" stroke="#b5761a" stroke-width="1.5" marker-end="url(#arrc)"/>
  <text x="280" y="160" font-size="12" fill="#b5761a" text-anchor="middle">σ 큼 (정보 적음)</text>
  <line x1="220" y1="170" x2="220" y2="150" stroke="#2e7d46" stroke-width="1.5" marker-end="url(#arrc)"/>
  <text x="222" y="145" font-size="12" fill="#2e7d46">σ 작음</text>
  <text x="40" y="252" font-size="12" fill="#6b7178">벽은 좌우 위치를 강하게 제약한다.</text>
  <text x="40" y="272" font-size="12" fill="#6b7178">진행 방향은 제약할 구조가 없어 covariance가 길게 늘어난다.</text>
  <text x="40" y="296" font-size="12" fill="#6b7178">→ 정보 행렬의 고유값: 좌우 큼, 진행 방향 ≈ 0 (degeneracy)</text>

  <!-- right: GPS -->
  <rect x="440" y="20" width="400" height="30" rx="15" fill="#fbeed6" stroke="#e6cfa0"/>
  <text x="640" y="40" font-size="14" fill="#b5761a" text-anchor="middle" font-weight="bold">GPS (야외 개활지)</text>
  <rect x="440" y="62" width="400" height="250" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <circle cx="640" cy="170" r="55" fill="#fbeed6" stroke="#b5761a" stroke-width="2" opacity="0.9"/>
  <circle cx="640" cy="170" r="4" fill="#b5761a"/>
  <line x1="640" y1="170" x2="690" y2="170" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrc)"/>
  <text x="700" y="174" font-size="12" fill="#6b7178">σ ≈ 수 m</text>
  <text x="460" y="252" font-size="12" fill="#6b7178">어느 방향이든 비슷한 오차(등방 covariance).</text>
  <text x="460" y="272" font-size="12" fill="#6b7178">절대 위치라 drift는 없지만 LiDAR보다 훨씬 거칠다.</text>
  <text x="460" y="296" font-size="12" fill="#6b7178">→ 두 소스를 방향별 정보량에 따라 합쳐야 한다</text>
</svg>
