<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a9199"/>
    </marker>
  </defs>

  <!-- 3D points box -->
  <rect x="40" y="80" width="300" height="300" rx="12" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <rect x="90" y="56" width="200" height="34" rx="17" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="190" y="78" text-anchor="middle" font-size="15" fill="#2c5aa0" font-weight="600">3D 점 (물체 좌표계)</text>

  <circle cx="120" cy="150" r="7" fill="#2c5aa0"/>
  <text x="100" y="135" font-size="13" fill="#333">P₁</text>
  <circle cx="230" cy="200" r="7" fill="#2c5aa0"/>
  <text x="240" y="188" font-size="13" fill="#333">P₂</text>
  <circle cx="150" cy="290" r="7" fill="#2c5aa0"/>
  <text x="128" y="308" font-size="13" fill="#333">P₃</text>
  <circle cx="260" cy="335" r="7" fill="#2c5aa0"/>
  <text x="272" y="348" font-size="13" fill="#333">P₄</text>
  <text x="190" y="368" text-anchor="middle" font-size="12" fill="#6b7178">모델에서 3D 좌표를 알고 있음</text>

  <!-- rays from camera center through image plane -->
  <line x1="820" y1="245" x2="120" y2="150" stroke="#8a9199" stroke-width="1.2" opacity="0.7"/>
  <line x1="820" y1="245" x2="230" y2="200" stroke="#8a9199" stroke-width="1.2" opacity="0.7"/>
  <line x1="820" y1="245" x2="150" y2="290" stroke="#8a9199" stroke-width="1.2" opacity="0.7"/>
  <line x1="820" y1="245" x2="260" y2="335" stroke="#8a9199" stroke-width="1.2" opacity="0.7"/>

  <!-- image plane -->
  <rect x="598" y="120" width="14" height="250" rx="4" fill="#f4f6f8" stroke="#c9ccd1"/>
  <rect x="500" y="56" width="210" height="34" rx="17" fill="#fbeed6" stroke="#e6cfa0"/>
  <text x="605" y="78" text-anchor="middle" font-size="15" fill="#b5761a" font-weight="600">2D 관측 (이미지 평면)</text>

  <circle cx="605" cy="215" r="5.5" fill="#b5761a"/>
  <text x="620" y="210" font-size="12" fill="#b5761a">u₁</text>
  <circle cx="605" cy="228" r="5.5" fill="#b5761a"/>
  <text x="620" y="233" font-size="12" fill="#b5761a">u₂</text>
  <circle cx="605" cy="258" r="5.5" fill="#b5761a"/>
  <text x="620" y="262" font-size="12" fill="#b5761a">u₃</text>
  <circle cx="605" cy="280" r="5.5" fill="#b5761a"/>
  <text x="620" y="290" font-size="12" fill="#b5761a">u₄</text>

  <!-- camera -->
  <circle cx="820" cy="245" r="8" fill="#333"/>
  <text x="820" y="225" text-anchor="middle" font-size="13" fill="#333">카메라 중심 C</text>
  <text x="820" y="300" text-anchor="middle" font-size="12" fill="#6b7178">intrinsics K는</text>
  <text x="820" y="316" text-anchor="middle" font-size="12" fill="#6b7178">calibration으로 알고 있음</text>

  <!-- unknown transform -->
  <line x1="345" y1="405" x2="590" y2="405" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="370" y="386" width="196" height="34" rx="17" fill="#e6f4ea" stroke="#b7dcc0"/>
  <text x="468" y="408" text-anchor="middle" font-size="15" fill="#2e7d46" font-weight="600">미지수: R, t (6DoF)</text>
</svg>
