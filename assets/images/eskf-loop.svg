<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a9199"/>
    </marker>
  </defs>

  <!-- nominal lane -->
  <rect x="20" y="20" width="820" height="30" rx="15" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="430" y="40" font-size="14" fill="#2c5aa0" text-anchor="middle" font-weight="bold">Nominal state  x̂ = (T̂, v̂, b̂ …)   : 곡면 위, 비선형 그대로 적분</text>
  <rect x="20" y="62" width="820" height="70" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <rect x="40" y="78" width="220" height="38" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="150" y="102" font-size="12" fill="#333" text-anchor="middle">IMU 적분: T̂ ← T̂ exp((ω, v)Δt)</text>
  <rect x="580" y="78" width="240" height="38" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="700" y="102" font-size="12" fill="#333" text-anchor="middle">injection: x̂ ← x̂ ⊞ δx̂  (T̂ ← T̂ exp(δξ^))</text>
  <line x1="262" y1="97" x2="576" y2="97" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arre)"/>
  <text x="419" y="90" font-size="11" fill="#6b7178" text-anchor="middle">nominal은 covariance를 모른다</text>

  <!-- error lane -->
  <rect x="20" y="160" width="820" height="30" rx="15" fill="#fbeed6" stroke="#e6cfa0"/>
  <text x="430" y="180" font-size="14" fill="#b5761a" text-anchor="middle" font-weight="bold">Error state  δx ∈ ℝ⁶⁺ (접평면 위, 항상 0 근처)   : 여기서만 Kalman filter</text>
  <rect x="20" y="202" width="820" height="110" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <rect x="40" y="220" width="220" height="70" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="150" y="244" font-size="12" fill="#333" text-anchor="middle">predict</text>
  <text x="150" y="264" font-size="12" fill="#6b7178" text-anchor="middle">P ← F P Fᵀ + Q</text>
  <text x="150" y="280" font-size="11" fill="#6b7178" text-anchor="middle">(δx̂ = 0 유지, F는 오차 동역학 Jacobian)</text>
  <rect x="320" y="220" width="220" height="70" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="430" y="244" font-size="12" fill="#333" text-anchor="middle">update (측정 z)</text>
  <text x="430" y="264" font-size="12" fill="#6b7178" text-anchor="middle">δx̂ = K (z ⊟ h(x̂)),  P ← (I−KH)P</text>
  <text x="430" y="280" font-size="11" fill="#6b7178" text-anchor="middle">H = ∂(z ⊟ h)/∂δx : 접평면 Jacobian</text>
  <rect x="600" y="220" width="220" height="70" rx="8" fill="#fff" stroke="#c9ccd1"/>
  <text x="710" y="244" font-size="12" fill="#333" text-anchor="middle">reset</text>
  <text x="710" y="264" font-size="12" fill="#6b7178" text-anchor="middle">δx̂ ← 0,  P ← G P Gᵀ (G ≈ I)</text>
  <text x="710" y="280" font-size="11" fill="#6b7178" text-anchor="middle">접평면을 새 T̂로 옮긴다</text>
  <line x1="262" y1="255" x2="316" y2="255" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arre)"/>
  <line x1="542" y1="255" x2="596" y2="255" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arre)"/>
  <!-- injection arrow from update to nominal -->
  <line x1="540" y1="230" x2="640" y2="120" stroke="#8a9199" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arre)"/>
  <text x="608" y="150" font-size="11" fill="#6b7178">δx̂ 를 nominal에 주입</text>

  <!-- note -->
  <rect x="20" y="330" width="820" height="36" rx="10" fill="#f6f7f9" stroke="#c9ccd1"/>
  <text x="36" y="353" font-size="12" fill="#333">nominal은 큰 값·비선형을 다 떠안고, error는 작고 선형에 가까워 EKF 가정이 잘 맞는다. 회전 특이점·정규화 문제도 error 쪽엔 없다.</text>
</svg>
