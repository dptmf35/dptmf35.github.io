<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a9199"/>
    </marker>
  </defs>

  <!-- right perturbation -->
  <rect x="20" y="20" width="400" height="30" rx="15" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="220" y="40" font-size="14" fill="#2c5aa0" text-anchor="middle" font-weight="bold">Right perturbation  T = T̂ exp(ξ^)</text>
  <rect x="20" y="62" width="400" height="250" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <!-- world axes -->
  <line x1="60" y1="250" x2="130" y2="250" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrp)"/>
  <line x1="60" y1="250" x2="60" y2="180" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="48" y="270" font-size="12" fill="#6b7178">world</text>
  <!-- body at T hat -->
  <g transform="translate(260,180) rotate(-25)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrp)"/>
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrp)"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="#e9f1fb" stroke="#2c5aa0" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <circle cx="260" cy="180" r="5" fill="#2c5aa0"/>
  <text x="300" y="120" font-size="12" fill="#2c5aa0">body frame</text>
  <text x="36" y="292" font-size="12" fill="#6b7178">ξ는 body frame에서 정의. 타원이 body 축을 따라 놓인다 (로봇 진행 방향으로 길게 등)</text>

  <!-- left perturbation -->
  <rect x="440" y="20" width="400" height="30" rx="15" fill="#fbeed6" stroke="#e6cfa0"/>
  <text x="640" y="40" font-size="14" fill="#b5761a" text-anchor="middle" font-weight="bold">Left perturbation  T = exp(ξ^) T̂</text>
  <rect x="440" y="62" width="400" height="250" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <line x1="480" y1="250" x2="550" y2="250" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrp)"/>
  <line x1="480" y1="250" x2="480" y2="180" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="468" y="270" font-size="12" fill="#6b7178">world</text>
  <g transform="translate(680,180) rotate(-25)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#b5761a" stroke-width="2" marker-end="url(#arrp)"/>
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#b5761a" stroke-width="2" marker-end="url(#arrp)"/>
  </g>
  <ellipse cx="680" cy="180" rx="55" ry="22" fill="#fbeed6" stroke="#b5761a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="680" cy="180" r="5" fill="#b5761a"/>
  <text x="720" y="120" font-size="12" fill="#b5761a">body frame</text>
  <text x="456" y="292" font-size="12" fill="#6b7178">ξ는 world frame에서 정의. 타원이 world 축을 따라 놓인다 (GPS처럼 절대 좌표 오차)</text>

  <!-- conversion -->
  <text x="430" y="326" font-size="12" fill="#333" text-anchor="middle">변환:  ξ_left = Ad_T̂ ξ_right,   Σ_left = Ad_T̂ Σ_right Ad_T̂ᵀ</text>
</svg>
