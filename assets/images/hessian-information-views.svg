<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrh" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a9199"/>
    </marker>
  </defs>

  <!-- three views -->
  <rect x="20" y="20" width="250" height="30" rx="15" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="145" y="40" font-size="14" fill="#2c5aa0" text-anchor="middle" font-weight="bold">최적화 관점</text>
  <rect x="20" y="62" width="250" height="150" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="36" y="88" font-size="12" fill="#333">cost  E(x) = ½ Σ rᵢᵀ Rᵢ⁻¹ rᵢ</text>
  <text x="36" y="112" font-size="12" fill="#6b7178">Gauss-Newton normal equation</text>
  <text x="36" y="132" font-size="12" fill="#333">(Jᵀ R⁻¹ J) δ = − Jᵀ R⁻¹ r</text>
  <text x="36" y="160" font-size="12" fill="#6b7178">계수 행렬 = cost의 곡률.</text>
  <text x="36" y="180" font-size="12" fill="#6b7178">곡률이 크면 그 방향은 조금만</text>
  <text x="36" y="198" font-size="12" fill="#6b7178">움직여도 cost가 급증 = 잘 정해짐</text>

  <rect x="305" y="20" width="250" height="30" rx="15" fill="#fbeed6" stroke="#e6cfa0"/>
  <text x="430" y="40" font-size="14" fill="#b5761a" text-anchor="middle" font-weight="bold">확률(사후분포) 관점</text>
  <rect x="305" y="62" width="250" height="150" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="321" y="88" font-size="12" fill="#333">p(x ∣ z) ∝ exp(−E(x))</text>
  <text x="321" y="112" font-size="12" fill="#6b7178">최적해 x* 주변에서 2차 전개</text>
  <text x="321" y="132" font-size="12" fill="#333">E(x) ≈ E(x*) + ½ δᵀ H δ</text>
  <text x="321" y="160" font-size="12" fill="#6b7178">→ p(x ∣ z) ≈ N(x*, H⁻¹)</text>
  <text x="321" y="180" font-size="12" fill="#6b7178">Laplace 근사: 사후 covariance가</text>
  <text x="321" y="198" font-size="12" fill="#6b7178">Hessian의 역행렬</text>

  <rect x="590" y="20" width="250" height="30" rx="15" fill="#e6f4ea" stroke="#b7dcc0"/>
  <text x="715" y="40" font-size="14" fill="#2e7d46" text-anchor="middle" font-weight="bold">추정 이론 관점</text>
  <rect x="590" y="62" width="250" height="150" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="606" y="88" font-size="12" fill="#333">Fisher information</text>
  <text x="606" y="108" font-size="12" fill="#333">I(x) = E[∇log p · ∇log pᵀ]</text>
  <text x="606" y="132" font-size="12" fill="#6b7178">Gaussian noise면  I = Jᵀ R⁻¹ J</text>
  <text x="606" y="160" font-size="12" fill="#6b7178">Cramér-Rao bound:</text>
  <text x="606" y="180" font-size="12" fill="#333">Cov(x̂) ≥ I(x)⁻¹</text>
  <text x="606" y="198" font-size="12" fill="#6b7178">어떤 unbiased 추정기도 이보다 못 함</text>

  <!-- converge arrows -->
  <line x1="145" y1="214" x2="380" y2="286" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrh)"/>
  <line x1="430" y1="214" x2="430" y2="286" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrh)"/>
  <line x1="715" y1="214" x2="480" y2="286" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrh)"/>

  <!-- unified box -->
  <rect x="230" y="292" width="400" height="52" rx="10" fill="#f6f7f9" stroke="#c9ccd1"/>
  <text x="430" y="314" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">Λ = H = Jᵀ R⁻¹ J = I(x),   Σ = Λ⁻¹</text>
  <text x="430" y="334" font-size="12" fill="#6b7178" text-anchor="middle">세 관점이 같은 행렬을 가리킨다: 이것이 information matrix다</text>
</svg>
