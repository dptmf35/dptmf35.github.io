<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a9199"/>
    </marker>
  </defs>

  <!-- column 1: cost volume CNN -->
  <rect x="20" y="20" width="250" height="30" rx="15" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="145" y="40" font-size="14" fill="#2c5aa0" text-anchor="middle" font-weight="bold">Cost Volume CNN</text>
  <rect x="20" y="62" width="250" height="216" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="36" y="90" font-size="13" fill="#333">MC-CNN (2015)</text>
  <text x="36" y="108" font-size="11" fill="#6b7178">matching cost만 CNN으로 학습</text>
  <text x="36" y="138" font-size="13" fill="#333">GC-Net (2017)</text>
  <text x="36" y="156" font-size="11" fill="#6b7178">4D cost volume + 3D conv + soft argmin</text>
  <text x="36" y="186" font-size="13" fill="#333">PSMNet (2018)</text>
  <text x="36" y="204" font-size="11" fill="#6b7178">pyramid pooling + stacked hourglass</text>
  <text x="36" y="234" font-size="13" fill="#333">GA-Net (2019)</text>
  <text x="36" y="252" font-size="11" fill="#6b7178">SGM을 미분 가능한 layer로</text>

  <!-- column 2: iterative -->
  <rect x="305" y="20" width="250" height="30" rx="15" fill="#e6f4ea" stroke="#b7dcc0"/>
  <text x="430" y="40" font-size="14" fill="#2e7d46" text-anchor="middle" font-weight="bold">Iterative Refinement</text>
  <rect x="305" y="62" width="250" height="216" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="321" y="90" font-size="13" fill="#333">RAFT-Stereo (2021)</text>
  <text x="321" y="108" font-size="11" fill="#6b7178">all-pairs correlation + ConvGRU 반복</text>
  <text x="321" y="126" font-size="11" fill="#6b7178">3D conv 없이 2D 연산만</text>
  <text x="321" y="156" font-size="13" fill="#333">CREStereo (2022)</text>
  <text x="321" y="174" font-size="11" fill="#6b7178">cascaded 반복 + 실제 영상 강건성</text>
  <text x="321" y="204" font-size="13" fill="#333">IGEV-Stereo (2023)</text>
  <text x="321" y="222" font-size="11" fill="#6b7178">Geometry Encoding Volume:</text>
  <text x="321" y="238" font-size="11" fill="#6b7178">정규화된 cost volume을 GRU가 참조</text>

  <!-- column 3: transformer / foundation -->
  <rect x="590" y="20" width="250" height="30" rx="15" fill="#fbeed6" stroke="#e6cfa0"/>
  <text x="715" y="40" font-size="14" fill="#b5761a" text-anchor="middle" font-weight="bold">Transformer · Foundation</text>
  <rect x="590" y="62" width="250" height="216" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="606" y="90" font-size="13" fill="#333">STTR (2021)</text>
  <text x="606" y="108" font-size="11" fill="#6b7178">epipolar line을 sequence matching으로</text>
  <text x="606" y="138" font-size="13" fill="#333">CroCo-Stereo (2023)</text>
  <text x="606" y="156" font-size="11" fill="#6b7178">cross-view completion pretraining</text>
  <text x="606" y="186" font-size="13" fill="#333">FoundationStereo (2025)</text>
  <text x="606" y="204" font-size="11" fill="#6b7178">DepthAnythingV2 feature 주입(STA)</text>
  <text x="606" y="220" font-size="11" fill="#6b7178">+ FSD 1M 합성 데이터</text>
  <text x="606" y="236" font-size="11" fill="#6b7178">zero-shot 범용 stereo</text>

  <!-- influence arrows -->
  <line x1="272" y1="170" x2="302" y2="170" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="557" y1="170" x2="587" y2="170" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- bottom notes -->
  <rect x="20" y="300" width="820" height="106" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="36" y="326" font-size="13" fill="#333" font-weight="bold">발전 흐름</text>
  <text x="36" y="350" font-size="12" fill="#6b7178">cost 계산만 학습 → cost volume 전체를 end-to-end로 → 3D conv 대신 반복 갱신(GRU)으로 경량화</text>
  <text x="36" y="372" font-size="12" fill="#6b7178">→ IGEV는 cost volume 정규화와 반복 갱신을 결합 → foundation model의 monocular prior를 주입해 zero-shot 일반화까지</text>
  <text x="36" y="394" font-size="12" fill="#6b7178">벤치마크도 KITTI(도메인 내 학습·평가)에서 Middlebury·ETH3D zero-shot 평가로 이동</text>
</svg>
