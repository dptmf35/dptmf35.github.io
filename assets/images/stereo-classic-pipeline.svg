<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <!-- step 1 -->
  <rect x="20" y="40" width="190" height="30" rx="15" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="115" y="60" font-size="14" fill="#2c5aa0" text-anchor="middle" font-weight="bold">① Matching Cost</text>
  <rect x="20" y="82" width="190" height="88" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="34" y="106" font-size="13" fill="#333">픽셀 유사도 계산</text>
  <text x="34" y="128" font-size="12" fill="#6b7178">SAD / SSD / NCC</text>
  <text x="34" y="148" font-size="12" fill="#6b7178">Census + Hamming</text>

  <!-- step 2 -->
  <rect x="238" y="40" width="190" height="30" rx="15" fill="#fbeed6" stroke="#e6cfa0"/>
  <text x="333" y="60" font-size="14" fill="#b5761a" text-anchor="middle" font-weight="bold">② Cost Aggregation</text>
  <rect x="238" y="82" width="190" height="88" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="252" y="106" font-size="13" fill="#333">주변 cost를 모아 안정화</text>
  <text x="252" y="128" font-size="12" fill="#6b7178">window 합산 (local)</text>
  <text x="252" y="148" font-size="12" fill="#6b7178">SGM 경로 합산</text>

  <!-- step 3 -->
  <rect x="456" y="40" width="190" height="30" rx="15" fill="#e6f4ea" stroke="#b7dcc0"/>
  <text x="551" y="60" font-size="14" fill="#2e7d46" text-anchor="middle" font-weight="bold">③ Optimization</text>
  <rect x="456" y="82" width="190" height="88" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="470" y="106" font-size="13" fill="#333">disparity 결정</text>
  <text x="470" y="128" font-size="12" fill="#6b7178">WTA (winner-takes-all)</text>
  <text x="470" y="148" font-size="12" fill="#6b7178">DP / Graph Cuts / BP</text>

  <!-- step 4 -->
  <rect x="674" y="40" width="166" height="30" rx="15" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="757" y="60" font-size="14" fill="#2c5aa0" text-anchor="middle" font-weight="bold">④ Refinement</text>
  <rect x="674" y="82" width="166" height="88" rx="10" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <text x="688" y="106" font-size="13" fill="#333">후처리</text>
  <text x="688" y="128" font-size="12" fill="#6b7178">left-right check</text>
  <text x="688" y="148" font-size="12" fill="#6b7178">subpixel / speckle 제거</text>

  <!-- arrows -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a9199"/>
    </marker>
  </defs>
  <line x1="212" y1="126" x2="234" y2="126" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="126" x2="452" y2="126" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="648" y1="126" x2="670" y2="126" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- method lanes -->
  <text x="20" y="216" font-size="13" fill="#2c5aa0" font-weight="bold">Local (BM):</text>
  <text x="112" y="216" font-size="12" fill="#6b7178">①에서 window cost → ③ WTA로 바로 결정. 빠르지만 textureless 영역에 약함</text>
  <text x="20" y="244" font-size="13" fill="#b5761a" font-weight="bold">Global:</text>
  <text x="112" y="244" font-size="12" fill="#6b7178">③에서 이미지 전체 energy 최소화. 정확하지만 느림 (NP-hard)</text>
  <text x="20" y="272" font-size="13" fill="#2e7d46" font-weight="bold">SGM (SGBM):</text>
  <text x="112" y="272" font-size="12" fill="#6b7178">②에서 여러 1D 경로의 DP로 global energy를 근사. 속도와 정확도의 절충</text>
</svg>
