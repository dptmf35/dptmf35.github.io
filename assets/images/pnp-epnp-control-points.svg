<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a9199"/>
    </marker>
  </defs>

  <!-- world frame -->
  <rect x="30" y="80" width="360" height="290" rx="12" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <rect x="120" y="56" width="180" height="34" rx="17" fill="#e9f1fb" stroke="#b9d0ec"/>
  <text x="210" y="78" text-anchor="middle" font-size="15" fill="#2c5aa0" font-weight="600">물체 좌표계</text>

  <!-- object points -->
  <circle cx="140" cy="200" r="4" fill="#9aa2ab"/>
  <circle cx="185" cy="165" r="4" fill="#9aa2ab"/>
  <circle cx="250" cy="185" r="4" fill="#9aa2ab"/>
  <circle cx="290" cy="240" r="4" fill="#9aa2ab"/>
  <circle cx="175" cy="280" r="4" fill="#9aa2ab"/>
  <circle cx="245" cy="300" r="4" fill="#9aa2ab"/>
  <circle cx="130" cy="255" r="4" fill="#9aa2ab"/>

  <!-- highlighted point with barycentric links -->
  <circle cx="215" cy="235" r="7" fill="#2c5aa0"/>
  <text x="222" y="224" font-size="13" fill="#2c5aa0" font-weight="600">pᵢ</text>
  <line x1="215" y1="235" x2="90" y2="150" stroke="#2c5aa0" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="215" y1="235" x2="330" y2="140" stroke="#2c5aa0" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="215" y1="235" x2="110" y2="330" stroke="#2c5aa0" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="215" y1="235" x2="320" y2="320" stroke="#2c5aa0" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- control points -->
  <rect x="83" y="143" width="14" height="14" rx="3" fill="#2e7d46"/>
  <text x="70" y="136" font-size="13" fill="#2e7d46" font-weight="600">c₁</text>
  <rect x="323" y="133" width="14" height="14" rx="3" fill="#2e7d46"/>
  <text x="343" y="145" font-size="13" fill="#2e7d46" font-weight="600">c₂</text>
  <rect x="103" y="323" width="14" height="14" rx="3" fill="#2e7d46"/>
  <text x="86" y="350" font-size="13" fill="#2e7d46" font-weight="600">c₃</text>
  <rect x="313" y="313" width="14" height="14" rx="3" fill="#2e7d46"/>
  <text x="333" y="338" font-size="13" fill="#2e7d46" font-weight="600">c₄</text>
  <text x="210" y="395" text-anchor="middle" font-size="12" fill="#6b7178">모든 점을 제어점 4개의 가중합 pᵢ = Σⱼ αᵢⱼ cⱼ 로 표현</text>

  <!-- arrow -->
  <line x1="400" y1="225" x2="500" y2="225" stroke="#8a9199" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="450" y="205" text-anchor="middle" font-size="12" fill="#6b7178">R, t 변환 후에도</text>
  <text x="450" y="250" text-anchor="middle" font-size="12" fill="#6b7178">α는 그대로 유지</text>

  <!-- camera frame -->
  <rect x="510" y="80" width="360" height="290" rx="12" fill="none" stroke="#c9ccd1" stroke-dasharray="5 4"/>
  <rect x="600" y="56" width="180" height="34" rx="17" fill="#fbeed6" stroke="#e6cfa0"/>
  <text x="690" y="78" text-anchor="middle" font-size="15" fill="#b5761a" font-weight="600">카메라 좌표계</text>

  <circle cx="640" cy="190" r="4" fill="#9aa2ab"/>
  <circle cx="690" cy="160" r="4" fill="#9aa2ab"/>
  <circle cx="745" cy="200" r="4" fill="#9aa2ab"/>
  <circle cx="775" cy="260" r="4" fill="#9aa2ab"/>
  <circle cx="660" cy="285" r="4" fill="#9aa2ab"/>
  <circle cx="730" cy="305" r="4" fill="#9aa2ab"/>

  <circle cx="700" cy="240" r="7" fill="#b5761a"/>
  <text x="708" y="229" font-size="13" fill="#b5761a" font-weight="600">pᵢᶜ</text>

  <rect x="583" y="148" width="14" height="14" rx="3" fill="#b5761a"/>
  <text x="568" y="142" font-size="13" fill="#b5761a" font-weight="600">c₁ᶜ</text>
  <rect x="808" y="153" width="14" height="14" rx="3" fill="#b5761a"/>
  <text x="828" y="165" font-size="13" fill="#b5761a" font-weight="600">c₂ᶜ</text>
  <rect x="598" y="318" width="14" height="14" rx="3" fill="#b5761a"/>
  <text x="580" y="345" font-size="13" fill="#b5761a" font-weight="600">c₃ᶜ</text>
  <rect x="793" y="303" width="14" height="14" rx="3" fill="#b5761a"/>
  <text x="813" y="328" font-size="13" fill="#b5761a" font-weight="600">c₄ᶜ</text>
  <text x="690" y="395" text-anchor="middle" font-size="12" fill="#6b7178">미지수 = 제어점 4개의 카메라 좌표 12개뿐 (점 개수 n과 무관)</text>
</svg>
